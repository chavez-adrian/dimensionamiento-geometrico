<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GD&amp;T - Aprendizaje Adaptativo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; padding: 2rem; min-height: 100vh; }
    h1 { text-align: center; margin-bottom: 0.5rem; font-size: 1.5rem; color: #f8fafc; }
    p.subtitle { text-align: center; color: #94a3b8; margin-bottom: 2rem; font-size: 0.875rem; }

    /* GRID VIEW */
    #grid-view { max-width: 860px; margin: 0 auto; }

    /* FUNDAMENTOS SECTION */
    .fundamentos-section { margin-bottom: 1.5rem; }
    .fundamentos-header { font-size: 0.75rem; color: #64748b; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; padding-left: 0.25rem; }
    .fundamentos-row {
      display: grid;
      grid-template-columns: 160px repeat(2, 1fr);
      gap: 0.5rem;
    }
    .fundamentos-row .row-label { color: #94a3b8; }

    .levels-header {
      display: grid;
      grid-template-columns: 160px repeat(3, 1fr);
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .levels-header div { text-align: center; font-size: 0.7rem; color: #64748b; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .grid-row {
      display: grid;
      grid-template-columns: 160px repeat(3, 1fr);
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .row-label {
      display: flex;
      align-items: center;
      font-size: 0.875rem;
      font-weight: 600;
      color: #cbd5e1;
      padding-left: 0.25rem;
    }
    .cell {
      border-radius: 0.5rem;
      padding: 0.875rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      min-height: 72px;
      justify-content: center;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .cell .nivel-label { font-size: 0.65rem; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.04em; }
    .cell .status { font-size: 0.7rem; font-weight: 600; margin-top: 0.2rem; }
    .cell.locked { background: #bdbdbd; border: 1px solid #9e9e9e; color: #424242; cursor: not-allowed; }
    .cell.unlocked { background: #1e3a5f; border: 1px solid #2563eb; color: #93c5fd; cursor: pointer; }
    .cell.unlocked:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(37,99,235,0.3); }
    .cell.in-progress { background: #451a03; border: 1px solid #d97706; color: #fcd34d; cursor: pointer; }
    .cell.in-progress:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(217,119,6,0.3); }
    .cell.mastered { background: #4caf50; border: 1px solid #388e3c; color: #fff; }
    .legend { display: flex; gap: 1.5rem; justify-content: center; margin-top: 1.5rem; font-size: 0.75rem; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 0.4rem; }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.locked { background: #bdbdbd; }
    .dot.unlocked { background: #2563eb; }
    .dot.in-progress { background: #d97706; }
    .dot.mastered { background: #4caf50; }

    /* EXERCISE VIEW */
    #exercise-view { display: none; max-width: 640px; margin: 0 auto; }
    .ex-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
    .ex-back { background: none; border: 1px solid #334155; color: #94a3b8; padding: 0.4rem 0.75rem; border-radius: 0.375rem; cursor: pointer; font-size: 0.8rem; }
    .ex-back:hover { border-color: #64748b; color: #e2e8f0; }
    .ex-tag { font-size: 0.75rem; color: #64748b; }
    .ex-question { font-size: 1.1rem; line-height: 1.6; margin-bottom: 1.5rem; color: #f1f5f9; }
    .ex-options { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem; }
    .ex-option {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.5rem;
      padding: 0.875rem 1rem;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      transition: border-color 0.15s, background 0.15s;
      text-align: left;
    }
    .ex-option:hover { border-color: #2563eb; background: #1e3a5f; }
    .ex-option.selected { border-color: #2563eb; background: #1e3a5f; }
    .ex-option input[type="radio"] { margin-top: 0.1rem; accent-color: #3b82f6; flex-shrink: 0; }
    .ex-submit {
      background: #2563eb;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s;
    }
    .ex-submit:hover { background: #1d4ed8; }
    .ex-submit:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
    .loading { color: #64748b; font-size: 0.9rem; padding: 1rem; text-align: center; }

    /* FEEDBACK VIEW */
    #feedback-view { display: none; max-width: 640px; margin: 0 auto; }
    .fb-result {
      padding: 1.25rem;
      border-radius: 0.5rem;
      margin-bottom: 1.25rem;
      font-size: 1.1rem;
      font-weight: 700;
    }
    .fb-result.correct { background: #14532d; border: 1px solid #16a34a; color: #86efac; }
    .fb-result.incorrect { background: #450a0a; border: 1px solid #dc2626; color: #fca5a5; }
    .fb-explanation { background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; padding: 1rem; margin-bottom: 1.25rem; line-height: 1.6; font-size: 0.9rem; color: #cbd5e1; }
    .fb-streak { text-align: center; color: #fbbf24; font-weight: 600; margin-bottom: 1.25rem; }
    .fb-continue {
      background: #2563eb;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    .fb-continue:hover { background: #1d4ed8; }
    .fb-unlock-badge { background: #14532d; border: 1px solid #16a34a; color: #86efac; padding: 0.75rem 1rem; border-radius: 0.5rem; margin-bottom: 1rem; text-align: center; font-size: 0.9rem; font-weight: 600; }
  </style>
</head>
<body>
  <h1>GD&amp;T Aprendizaje Adaptativo</h1>
  <p class="subtitle">ASME Y14.5-2018 (R2024) - Troqueles de Embutido</p>

  <!-- GRID VIEW -->
  <div id="grid-view">
    <div class="fundamentos-section">
      <div class="fundamentos-header">Fundamentos (Prerequisito)</div>
      <div class="fundamentos-row">
        <div class="row-label">Fundamentos</div>
        <div id="fund-cell-1" class="cell locked"></div>
        <div id="fund-cell-2" class="cell locked"></div>
      </div>
    </div>
    <div class="levels-header">
      <div></div>
      <div>Vocabulario</div>
      <div>Concepto Mecanico</div>
      <div>Criterio de Decision</div>
    </div>
    <div id="grid-rows"></div>
    <div class="legend">
      <div class="legend-item"><div class="dot locked"></div> Bloqueado</div>
      <div class="legend-item"><div class="dot unlocked"></div> Disponible</div>
      <div class="legend-item"><div class="dot in-progress"></div> En progreso</div>
      <div class="legend-item"><div class="dot mastered"></div> Dominado</div>
    </div>
  </div>

  <!-- EXERCISE VIEW -->
  <div id="exercise-view">
    <div class="ex-header">
      <button class="ex-back" onclick="showGrid()">&#8592; Volver</button>
      <span class="ex-tag" id="ex-tag"></span>
    </div>
    <div id="ex-loading" class="loading">Generando ejercicio...</div>
    <div id="ex-content" style="display:none">
      <div class="ex-question" id="ex-question"></div>
      <div class="ex-options" id="ex-options"></div>
      <button class="ex-submit" id="ex-submit" disabled onclick="submitExercise()">Verificar respuesta</button>
    </div>
  </div>

  <!-- FEEDBACK VIEW -->
  <div id="feedback-view">
    <div id="fb-result-box" class="fb-result"></div>
    <div class="fb-explanation" id="fb-explanation"></div>
    <div class="fb-streak" id="fb-streak"></div>
    <div id="fb-unlock" style="display:none" class="fb-unlock-badge"></div>
    <button class="fb-continue" onclick="continueExercise()">Continuar practicando</button>
  </div>

  <script>
    const CONTROLS = ['Planitud', 'Paralelismo', 'Perpendicularidad', 'Posicion', 'Cilindricidad'];
    const LEVELS = [
      { num: 1, label: 'Vocabulario' },
      { num: 2, label: 'Concepto Mecanico' },
      { num: 3, label: 'Criterio de Decision' },
    ];

    let currentExercise = null;
    let currentControl = null;
    let currentNivel = null;
    let stateMap = {};

    async function loadState() {
      const res = await fetch('/api/state');
      const data = await res.json();
      stateMap = data.state || {};
    }

    function getCellState(control, nivel) {
      const key = `${control}:${nivel}`;
      return stateMap[key] || { unlocked: false, mastered: false, attempts: 0, correct_streak: 0 };
    }

    function buildCell(div, cellData, levelLabel, control, levelNum) {
      div.innerHTML = '';
      let cls = 'cell ';
      if (!cellData.unlocked) {
        cls += 'locked';
      } else if (cellData.mastered) {
        cls += 'mastered';
      } else if (cellData.attempts > 0) {
        cls += 'in-progress';
      } else {
        cls += 'unlocked';
      }
      div.className = cls;

      const levelSpan = document.createElement('span');
      levelSpan.className = 'nivel-label';
      levelSpan.textContent = levelLabel;
      div.appendChild(levelSpan);

      const statusSpan = document.createElement('span');
      statusSpan.className = 'status';
      if (!cellData.unlocked) {
        statusSpan.textContent = '🔒';
      } else if (cellData.mastered) {
        statusSpan.textContent = '✓';
      } else {
        statusSpan.textContent = cellData.correct_streak;
      }
      div.appendChild(statusSpan);

      div.onclick = null;
      if (cellData.unlocked && !cellData.mastered && control !== null) {
        div.onclick = () => startExercise(control, levelNum);
      }
    }

    function renderFundamentos() {
      const fundLevels = [
        { num: 1, label: 'Vocabulario' },
        { num: 2, label: 'Concepto Mecanico' },
      ];
      fundLevels.forEach(level => {
        const div = document.getElementById(`fund-cell-${level.num}`);
        const cellData = getCellState('Fundamentos', level.num);
        buildCell(div, cellData, level.label, 'Fundamentos', level.num);
      });
    }

    function renderGrid() {
      renderFundamentos();
      const container = document.getElementById('grid-rows');
      container.innerHTML = '';
      CONTROLS.forEach(control => {
        const row = document.createElement('div');
        row.className = 'grid-row';
        const label = document.createElement('div');
        label.className = 'row-label';
        label.textContent = control;
        row.appendChild(label);

        LEVELS.forEach(level => {
          const cellData = getCellState(control, level.num);
          const div = document.createElement('div');
          buildCell(div, cellData, level.label, control, level.num);
          row.appendChild(div);
        });
        container.appendChild(row);
      });
    }

    function showGrid() {
      document.getElementById('grid-view').style.display = 'block';
      document.getElementById('exercise-view').style.display = 'none';
      document.getElementById('feedback-view').style.display = 'none';
      loadState().then(renderGrid);
    }

    async function startExercise(control, nivel) {
      currentControl = control;
      currentNivel = nivel;
      document.getElementById('grid-view').style.display = 'none';
      document.getElementById('exercise-view').style.display = 'block';
      document.getElementById('feedback-view').style.display = 'none';
      document.getElementById('ex-loading').style.display = 'block';
      document.getElementById('ex-content').style.display = 'none';
      document.getElementById('ex-tag').textContent = `${control} - Nivel ${nivel}`;

      try {
        const res = await fetch('/api/exercise/next', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ control, nivel }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error generando ejercicio');
        currentExercise = data.exercise;
        renderExercise(data.exercise);
      } catch (err) {
        document.getElementById('ex-loading').textContent = 'Error: ' + err.message;
      }
    }

    function renderExercise(exercise) {
      document.getElementById('ex-loading').style.display = 'none';
      document.getElementById('ex-content').style.display = 'block';
      document.getElementById('ex-question').textContent = exercise.question;

      const optionsContainer = document.getElementById('ex-options');
      optionsContainer.innerHTML = '';
      exercise.options.forEach((opt, i) => {
        const label = document.createElement('label');
        label.className = 'ex-option';
        label.innerHTML = `<input type="radio" name="ex-answer" value="${i}"> <span>${opt}</span>`;
        label.querySelector('input').addEventListener('change', () => {
          document.querySelectorAll('.ex-option').forEach(el => el.classList.remove('selected'));
          label.classList.add('selected');
          document.getElementById('ex-submit').disabled = false;
        });
        optionsContainer.appendChild(label);
      });
      document.getElementById('ex-submit').disabled = true;
    }

    async function submitExercise() {
      const selected = document.querySelector('input[name="ex-answer"]:checked');
      if (!selected) return;
      const answerIndex = parseInt(selected.value);
      document.getElementById('ex-submit').disabled = true;

      try {
        const res = await fetch('/api/exercise/evaluate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ exercise: currentExercise, answer_index: answerIndex }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error evaluando');
        showFeedback(data.result, data.newState);
      } catch (err) {
        alert('Error: ' + err.message);
        document.getElementById('ex-submit').disabled = false;
      }
    }

    function showFeedback(result, newState) {
      document.getElementById('exercise-view').style.display = 'none';
      document.getElementById('feedback-view').style.display = 'block';

      const resultBox = document.getElementById('fb-result-box');
      if (result.correct) {
        resultBox.className = 'fb-result correct';
        resultBox.textContent = 'Correcto';
      } else {
        resultBox.className = 'fb-result incorrect';
        resultBox.textContent = 'Incorrecto';
      }

      document.getElementById('fb-explanation').textContent = result.explanation;

      const cell = newState[currentControl] && newState[currentControl][currentNivel];
      if (cell) {
        const streak = cell.correct_streak;
        const mastered = cell.mastered;
        const streakEl = document.getElementById('fb-streak');
        if (mastered) {
          streakEl.textContent = 'Celda DOMINADA - 4 respuestas correctas consecutivas';
        } else {
          streakEl.textContent = `Racha actual: ${streak}/4`;
        }

        const unlockEl = document.getElementById('fb-unlock');
        const nextNivel = currentNivel + 1;
        const nextCell = newState[currentControl] && newState[currentControl][nextNivel];
        if (mastered && nextCell && nextCell.unlocked && currentNivel < 3) {
          unlockEl.style.display = 'block';
          unlockEl.textContent = `Nivel ${nextNivel} (${['', 'Vocabulario', 'Concepto Mecanico', 'Criterio de Decision'][nextNivel]}) desbloqueado`;
        } else {
          unlockEl.style.display = 'none';
        }
      }

      stateMap = {};
      if (newState) {
        Object.keys(newState).forEach(control => {
          Object.keys(newState[control]).forEach(nivel => {
            stateMap[`${control}:${nivel}`] = newState[control][nivel];
          });
        });
      }
    }

    function continueExercise() {
      const cell = stateMap[`${currentControl}:${currentNivel}`];
      if (cell && cell.mastered) {
        showGrid();
      } else {
        startExercise(currentControl, currentNivel);
      }
    }

    showGrid();
  </script>
</body>
</html>
